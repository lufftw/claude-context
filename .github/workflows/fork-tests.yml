# Fork-owned test workflow (lufftw/claude-context).
#
# The upstream ci.yml only builds; the fork's Jest and node:test suites (core unit + integration,
# mcp) were never run in CI. This file is new and fork-owned, so upstream merges never conflict
# with it — keep it when syncing (docs/maintenance/upstream-sync.md).
#
# Integration tests (*.int.test.ts) are hermetic (in-memory fakes); no services or secrets.
# Jest is invoked directly with `shell: bash` because the npm scripts' single-quoted patterns are
# passed literally by cmd.exe on Windows.
name: Fork tests

on:
  push:
    branches: [main, claude_context, "claude/**"]
  pull_request:
    branches: [main, claude_context]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Secret scan
        run: node scripts/check-secrets.mjs

      - name: Core unit tests (Jest)
        run: pnpm --filter @zilliz/claude-context-core exec jest --runInBand --testPathIgnorePatterns '\.int\.test\.ts$'

      - name: Core integration tests (Jest, hermetic)
        run: pnpm --filter @zilliz/claude-context-core exec jest --runInBand --testMatch '**/__tests__/**/*.int.test.ts'

      - name: MCP tests (node:test)
        run: pnpm --filter @zilliz/claude-context-mcp test
